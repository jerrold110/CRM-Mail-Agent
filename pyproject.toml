
[project]
name = "shared-python-environment"
version = "0.1.0"
requires-python = "==3.11.5"

dependencies = [
    # LangChain / LangGraph
    "langchain==1.2.0",
    "langchain-openai==1.1.6",
    "langgraph==1.0.7",
    "langgraph-prebuilt==1.0.7",

    # PostgreSQL
    "psycopg[binary,pool]==3.3.2",
    "langgraph-checkpoint-postgres==3.0.3",

    # Application dependencies
    "dotenv==0.9.9",
    "openai==2.14.0",
    "pydantic==2.12.5",
    "langfuse==3.12.0",
    "redis==7.1.0",
    "celery==5.6.2",

    # API
    "fastapi[standard]>=0.120.0",
]

[tool.uv]
package = false
