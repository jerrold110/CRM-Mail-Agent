apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-redis-broker
  labels:
    app: {{ .Release.Name }}-redis-broker
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: {{ .Values.redisBroker.port }}
      targetPort: redis
  selector:
    app: {{ .Release.Name }}-redis-broker
