apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-internal-database-sql
  labels:
    app: {{ .Release.Name }}-internal-database-sql
spec:
  clusterIP: None # Headless Service for the PostgreSQL StatefulSet.
  ports:
    - name: postgres
      port: {{ .Values.postgres.port }}
      targetPort: postgres
  selector:
    app: {{ .Release.Name }}-internal-database-sql
