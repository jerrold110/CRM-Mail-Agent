apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-redis-commander
  labels:
    app: {{ .Release.Name }}-redis-commander
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.redisCommander.port }}
      targetPort: http
  selector:
    app: {{ .Release.Name }}-redis-commander
