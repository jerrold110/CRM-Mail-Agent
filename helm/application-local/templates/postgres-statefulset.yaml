apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-internal-database-sql
  labels:
    app: {{ .Release.Name }}-internal-database-sql
spec:
  serviceName: {{ .Release.Name }}-internal-database-sql
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: {{ .Release.Name }}-internal-database-sql
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-internal-database-sql
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: {{ .Values.postgres.port }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
          # Deliberately no volumeMounts or volumeClaimTemplates.
          # No PVC means data is NOT durable across Pod replacement.
          # volumeMounts:
          #   - name: postgres-data
          #     mountPath: /var/lib/postgresql/data
          # Original Compose healthcheck (readiness, not a container restart rule).
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  PGPASSWORD="$POSTGRES_PASSWORD"
                  psql -h 127.0.0.1 -p {{ .Values.postgres.port }}
                  -U "$POSTGRES_USER"
                  -d "$POSTGRES_DB"
                  -v ON_ERROR_STOP=1 -qAt
                  -c 'SELECT 1' | grep -qx '1'
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
  # No PersistentVolumeClaims for this disposable portfolio environment.
  # To enable persistence later, add a matching volumeMount and a
  # volumeClaimTemplates entry; do NOT just uncomment the mount alone.
  # volumeClaimTemplates:
  #   - metadata:
  #       name: postgres-data
  #     spec:
  #       accessModes: ["ReadWriteOnce"]
  #       resources:
  #         requests:
  #           storage: 5Gi
